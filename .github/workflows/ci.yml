name: infosec lab1

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-sast:
    name: Build, tests and SpotBugs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and run tests
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Upload build and SpotBugs reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-and-spotbugs-reports
          path: |
            **/target/spotbugs*.xml
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
          if-no-files-found: ignore

  snyk-sca:
    name: Snyk dependency vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Snyk CLI
        uses: snyk/actions/setup@master
        with:
          snyk-version: latest

      - name: Run Snyk test
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          mkdir -p target
          snyk test --all-projects --severity-threshold=high \
            --json-file-output=target/snyk-report.json

      - name: Upload Snyk report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snyk-sca-report
          path: target/snyk-report.json
          if-no-files-found: ignore
